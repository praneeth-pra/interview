<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f0e8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161410" media="(prefers-color-scheme: dark)"><meta name="robots" content="noindex, nofollow"><title>Onboarding · __HOST__</title>__OG__<link rel="icon" type="image/png" href="/favicon.png?v=8"><link rel="preload" href="/assets/figtree-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/assets/instrument-serif.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/enquiry.css"></head><body><main class="eq" id="eq"><header class="eh"><a class="host" href="/"><span class="mark" aria-hidden="true"></span>__HOST__</a><h1>Onboarding</h1><p class="lead">Fill in your details and upload your Aadhaar and PAN cards. Only the __HOST__ team sees them.</p></header><form id="f" novalidate><div class="f"><label for="nm">Full name</label><input id="nm" name="name" autocomplete="name" maxlength="100" required></div><div class="row2"><div class="f"><label for="em">Email (same as your Naukri profile)</label><input id="em" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="200" required></div><div class="f"><label for="ph">Phone number</label><input id="ph" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="98765 43210" required></div></div><div class="row2"><div class="f"><label for="tc">Technology</label><input id="tc" name="tech" list="techs" autocomplete="off" maxlength="100" placeholder="e.g. Java, Python, DevOps" required><datalist id="techs"><option value="Java"><option value="Python"><option value=".NET"><option value="JavaScript / React"><option value="Angular"><option value="Node.js"><option value="Full Stack"><option value="Data Science"><option value="Data Engineering"><option value="AI / Machine Learning"><option value="DevOps"><option value="Cloud (AWS / Azure / GCP)"><option value="Testing / QA"><option value="Automation Testing"><option value="SAP"><option value="Salesforce"><option value="Power BI"><option value="Cyber Security"></datalist></div><div class="f"><label for="yx">Years of experience</label><select id="yx" name="experience" required><option value="">Select</option><option>Fresher</option><option>Less than 1 year</option><option>1 year</option><option>2 years</option><option>3 years</option><option>4 years</option><option>5 years</option><option>6 years</option><option>7 years</option><option>8 years</option><option>9 years</option><option>10 years</option><option>11–15 years</option><option>More than 15 years</option></select></div></div><div class="row2"><div class="f"><label for="gn">Is your experience genuine?</label><select id="gn" name="genuine" required><option value="">Select</option><option value="yes">Yes</option><option value="no">No</option></select></div><div class="f"><label for="li">LinkedIn profile</label><input id="li" name="linkedin" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" maxlength="200" placeholder="linkedin.com/in/your-name" required></div></div><div class="row2"><div class="f"><label for="ad">Aadhaar card</label><label class="drop" for="ad" id="adbox"><input id="ad" name="aadhaar" type="file" accept="image/*,.pdf,application/pdf" required aria-describedby="adhint"><span class="dico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span><span class="dtxt"><b id="adname">Upload your Aadhaar card</b><small id="adhint">A photo or PDF</small></span></label></div><div class="f"><label for="pn">PAN card</label><label class="drop" for="pn" id="pnbox"><input id="pn" name="pan" type="file" accept="image/*,.pdf,application/pdf" required aria-describedby="pnhint"><span class="dico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></span><span class="dtxt"><b id="pnname">Upload your PAN card</b><small id="pnhint">A photo or PDF</small></span></label></div></div><div class="hp" aria-hidden="true"><label for="ws">Website</label><input id="ws" name="website" tabindex="-1" autocomplete="off"></div><button id="go" type="submit">Submit</button><div id="err" class="err" role="alert"></div></form><section id="done" class="done" hidden><div class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><h2>Thank you!</h2><p id="donetxt">We've received your details.</p></section></main><script type="application/json" id="boot">__BOOT__</script><script src="/assets/onboarding.js"></script></body></html>
