name: mac app

on:
  pull_request:
    paths: ["mac-app/**", ".github/workflows/mac-app.yml"]
  push:
    branches: [main]
    paths: ["mac-app/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mac-app
    steps:
      - uses: actions/checkout@v7
      - name: Build the .app and .dmg (native Swift, Apple silicon and Intel; not signed with a Developer ID)
        run: ./build.sh
      - name: Link-rule checks
        run: dist/Hi-Techie.app/Contents/MacOS/Hi-Techie --self-test
      - name: The app starts and stays up
        run: |
          dist/Hi-Techie.app/Contents/MacOS/Hi-Techie &
          PID=$!
          sleep 10
          kill -0 $PID   # still running after 10 s, so it didn't crash on start
          kill $PID
      - uses: actions/upload-artifact@v7
        with:
          name: Hi-Techie-mac
          path: mac-app/dist/*.dmg
          retention-days: 30
