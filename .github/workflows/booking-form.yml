name: booking-form tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["calendly-live-view/**", ".github/workflows/booking-form.yml"]
  push:
    branches: [main]
    paths: ["calendly-live-view/**", ".github/workflows/booking-form.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: calendly-live-view
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install the type checker (dev only; the app itself has no dependencies)
        run: bun install --frozen-lockfile
      - name: Install the receipt readers the Docker image has (tesseract, pdftotext)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Server and unit tests, with coverage of the in-process code (bunfig.toml sets the bar)
        run: bun run test:coverage
      - name: Type check the server (strict) and the page modules
        run: bun run typecheck
      - name: Formatting (Prettier; `bun run format` fixes it)
        run: bun run format:check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - name: Browser smoke test
        run: NODE_PATH=$(npm root -g) node tests/browser-smoke.cjs
      - name: Accessibility (axe-core, WCAG 2.1 A and AA, every page, desktop and phone, light and dark)
        run: NODE_PATH=$(npm root -g) node tests/a11y.cjs

  # Every screen of the PR must look exactly like the base branch. For intentional design changes,
  # add the "ui-change" label to the PR and review the screenshots yourself instead.
  visual:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ui-change')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: calendly-live-view
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - name: Compare every screen with the base branch
        run: NODE_PATH=$(npm root -g) node tests/visual.cjs --base origin/${{ github.base_ref }} --out ${{ runner.temp }}/visual
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-differences
          path: ${{ runner.temp }}/visual
