name: booking-form tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["calendly-live-view/**", ".github/workflows/booking-form.yml"]
  push:
    branches: [main]
    paths: ["calendly-live-view/**", ".github/workflows/booking-form.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: calendly-live-view
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Server and unit tests
        run: bun test tests/
      - name: Type check page modules
        run: npx -y -p typescript@5 tsc -p src/pages/tsconfig.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - name: Browser smoke test
        run: NODE_PATH=$(npm root -g) node tests/browser-smoke.cjs

  # Every screen of the PR must look exactly like the base branch. For intentional design changes,
  # add the "ui-change" label to the PR and review the screenshots yourself instead.
  visual:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ui-change')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: calendly-live-view
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - name: Compare every screen with the base branch
        run: NODE_PATH=$(npm root -g) node tests/visual.cjs --base origin/${{ github.base_ref }} --out ${{ runner.temp }}/visual
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: ${{ runner.temp }}/visual
